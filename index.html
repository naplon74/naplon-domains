<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The UNIX roulette</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="style.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="page-shell">
        <main class="first-text">
            <h1>Welcome to the UNIX roulette!</h1>

            <div class="controls-row">
                <button type="button" class="start-button" id="start-button" onclick="roll()">Start</button>
                <button type="button" class="replay-button hidden" id="replay-button" onclick="roll()">Replay</button>
                <button type="button" class="settings-toggle" id="settings-toggle" aria-label="Exclude distros" title="Exclude distros">⚙️</button>
            </div>

            <div class="exclude-panel hidden" id="exclude-panel">
                <div class="filter-grid">
                    <div class="filter-group">
                        <p>Difficulty</p>
                        <label><input type="checkbox" class="difficulty-filter" value="easy" checked /> Easy</label>
                        <label><input type="checkbox" class="difficulty-filter" value="medium" checked /> Medium</label>
                        <label><input type="checkbox" class="difficulty-filter" value="hard" checked /> Hard</label>
                    </div>

                    <div class="filter-group">
                        <p>Family</p>
                        <label><input type="checkbox" class="family-filter" value="linux" checked /> Linux</label>
                        <label><input type="checkbox" class="family-filter" value="bsd" checked /> BSD</label>
                        <label><input type="checkbox" class="family-filter" value="other" checked /> Other systems</label>
                    </div>
                </div>

                <label for="exclude-input">Exclude distro names:</label>
                <input id="exclude-input" type="text" placeholder="Ubuntu, Fedora, Arch Linux" />
                <p class="exclude-help">Type names exactly as they appear in os.json to remove them from the roulette.</p>
            </div>

            <p id="loading-text" class="loading-text">Press start to spin.</p>

            <section id="result-card" class="result-card" aria-live="polite">
                <div class="winner-header">
                    <h2 id="result-name"></h2>
                    <span id="result-difficulty" class="difficulty-badge"></span>
                    <span id="result-family" class="family-badge"></span>
                </div>
                <div id="result-image-wrap" class="result-image-wrap hidden">
                    <img id="result-image" class="result-image" alt="" />
                </div>
                <p id="result-comment"></p>
                <a id="result-link" target="_blank" rel="noopener noreferrer"></a>
            </section>
        </main>
    </div>

    <footer>
        <p>Link not working? Send me an <a href="mailto:naplon@ik.me" tager="_blank">Email</a>.</p>
        <p>The Unix roulette by <a href="https://github.com/naplon74" target="_blank">naplon</a></p>
    </footer>

    <div id="image-lightbox" class="image-lightbox hidden" role="dialog" aria-modal="true" aria-label="Image preview">
        <img id="lightbox-image" class="lightbox-image" alt="" />
        <p class="lightbox-hint">Click anywhere or press Escape to close</p>
    </div>
</body>
</html>
